  <noscript>
    <div style="padding: 30px; text-align: center; font-family: sans-serif; direction: rtl;">
      <h1>تعلم مع يونس - Learn With Younis</h1>
      <p>أفضل منصة تعليمية مجانية وتفاعلية للأطفال: تعلم الحروف الإنجليزية والعربية، الفونكس، الكلمات، الأرقام، وقصص وألعاب أطفال ممتعة ومفيدة.</p>
      <p>من فضلك فعّل JavaScript لتشغيل الألعاب والأصوات التفاعلية.</p>
    </div>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- In-App Browser Detector (Facebook, Instagram, TikTok...): the microphone does not work there -->
  <div id="inapp-warning" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:999999; color:white; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;">
    <h1 style="font-size:30px; margin-bottom:15px; color:#ffdd00;">⚠️ تنبيه هام</h1>
    <p style="font-size:20px; line-height:1.6;">أنت تستخدم متصفح تطبيق آخر (فيسبوك / إنستجرام / تيك توك...)، وهذا قد يمنع عمل <b>الميكروفون والصوت</b>.</p>
    <p style="font-size:20px; margin-top:24px; font-weight:bold;">اضغط على النقاط الثلاث (⋮) أو (⋯) واختر:<br><br>
      <span style="background:#ffdd00; color:black; padding:10px 20px; border-radius:10px; display:inline-block;">🌐 فتح في المتصفح الخارجي</span></p>
    <div style="margin-top:28px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button id="inapp-copy" style="background:#38bdf8; color:#052e4a; font-size:18px; font-weight:800; padding:12px 22px; border-radius:12px; border:0;">📋 نسخ الرابط</button>
      <button id="inapp-continue" style="background:#ffffff22; color:white; font-size:18px; font-weight:800; padding:12px 22px; border-radius:12px; border:2px solid #ffffff66;">متابعة على أي حال</button>
    </div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var inApp = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|musical_ly|TikTok|BytedanceWebview|Snapchat|Line\/|LinkedInApp/i.test(ua);
      if (!inApp) return;

      var box = document.getElementById('inapp-warning');
      if (/android/i.test(ua)) {
        // try to open Chrome; if it is not installed, Android falls back to the normal URL
        var url = window.location.href.replace(/^https?:\/\//i, '');
        var fallback = encodeURIComponent(window.location.href);
        window.location.href = 'intent://' + url + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + fallback + ';end';
      }
      box.style.display = 'flex';

      document.getElementById('inapp-continue').onclick = function () { box.style.display = 'none'; };
      document.getElementById('inapp-copy').onclick = function () {
        var btn = this;
        var done = function () { btn.textContent = '✅ تم النسخ'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(window.location.href).then(done, function () { window.prompt('انسخ الرابط:', window.location.href); });
        } else { window.prompt('انسخ الرابط:', window.location.href); }
      };
    })();
  </script>
